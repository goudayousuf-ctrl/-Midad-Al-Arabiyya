<script>
  document.querySelectorAll('nav a').forEach(el => {
    el.addEventListener('mouseenter', () => {
      if(!el.classList.contains('active') && !el.style.background.includes('E6F2F2')) {
        el.style.background = '#F4EFE6';
        el.style.borderColor = '#C5A059';
        el.style.color = '#C5A059';
        el.style.transform = 'translateY(-1px)';
      }
    });
    el.addEventListener('mouseleave', () => {
      if(!el.classList.contains('active') && !el.style.background.includes('E6F2F2')) {
        el.style.background = '#FAF9F6';
        el.style.borderColor = '#EAE5D9';
        el.style.color = '#5A605C';
        el.style.transform = 'translateY(0)';
      }
    });
  });
</script>
