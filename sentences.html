<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم التراكيب والجمل | مداد AI</title>
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  body{ background:#F7F5F0; color:#2C302E; font-family:'IBM Plex Sans Arabic', sans-serif; padding:30px; margin:0; line-height:1.9; }
  .wrapper{ max-width:900px; margin:0 auto; }
  
  nav { background:#FFFFFF; padding:20px; border-bottom:2px solid #E2DDD5; display:flex; justify-content:center; gap:15px; margin-bottom:35px; border-radius:16px; box-shadow:0 6px 25px rgba(0,0,0,0.04); flex-wrap:wrap; }
  nav a { display:flex; flex-direction:column; align-items:center; text-decoration:none; color:#5A605C; font-weight:600; font-size:13px; padding:10px 18px; border-radius:12px; transition:0.3s; background:#FAF9F6; border:1px solid #EAE5D9; }
  nav a:hover { background:#F4EFE6; transform: translateY(-2px); border-color:#C5A059; color:#C5A059; }
  nav a.active { background:#F4EFE6; border-color:#C5A059; color:#C5A059; font-weight:700; }

  .card{ background:#FFFFFF; padding:45px; border-radius:18px; border:1px solid #E2DDD5; box-shadow:0 6px 25px rgba(0,0,0,0.03); margin-bottom:30px; }
  h2{ font-family:'Rakkas',serif; color:#C5A059; font-size:30px; margin-bottom:15px; margin-top:0; }
  .field{ margin-bottom:24px; }
  label{ display:block; margin-bottom:8px; color:#5A605C; font-size:14px; font-weight:600; }
  input, textarea{ width:100%; background:#FAF9F6; border:1px solid #D6D0C4; color:#2C302E; padding:14px 16px; border-radius:12px; font-family:inherit; font-size:15px; box-sizing:border-box; transition:0.3s; }
  input:focus, textarea:focus{ outline:none; border-color:#C5A059; background:#FFF; box-shadow:0 0 0 4px rgba(197,160,89,0.1); }
  
  button{ background:#C5A059; color:#FFF; padding:15px 35px; border:none; border-radius:12px; font-weight:600; cursor:pointer; font-size:16px; transition:0.3s; box-shadow:0 4px 15px rgba(197,160,89,0.25); }
  button:hover{ background:#B38F4E; transform: translateY(-1px); }
  .output{ margin-top:30px; padding:35px; background:#FAF9F6; border:1px solid #E2DDD5; border-radius:14px; white-space:pre-wrap; display:none; line-height:2.2; font-size:15.5px; color:#1F2321; }
</style>
</head>
<body>
<div class="wrapper">
  <nav>
    <a href="index.html"><span style="font-size:22px; margin-bottom:5px;">🏠</span>الرئيسية</a>
    <a href="workspace.html"><span style="font-size:22px; margin-bottom:5px;">🎯</span>الدروس</a>
    <a href="vocabulary.html"><span style="font-size:22px; margin-bottom:5px;">📚</span>المفردات</a>
    <a href="sentences.html" class="active"><span style="font-size:22px; margin-bottom:5px;">✍️</span>الجمل</a>
    <a href="dialogues.html"><span style="font-size:22px; margin-bottom:5px;">💬</span>الحوارات</a>
    <a href="exercises.html"><span style="font-size:22px; margin-bottom:5px;">📝</span>التدريبات</a>
    <a href="analysis.html"><span style="font-size:22px; margin-bottom:5px;">📊</span>التحليل</a>
    <a href="supervisor.html"><span style="font-size:22px; margin-bottom:5px;">👔</span>الإشراف</a>
  </nav>

  <div class="card">
    <h2>✍️ قسم الجمل والتراكيب اللغوية الوظيفية</h2>
    <div class="field">
      <label>أدخل الكلمات أو النمط النحوي لتوليد جمل مشكولة ومرتبة</label>
      <textarea id="vocabList" rows="3" placeholder="أحب، أذهب، البيت..."></textarea>
    </div>
    <div class="field">
      <label>المستوى اللغوي المستهدف</label>
      <input id="level" type="text" value="مبتدئ">
    </div>
    <button id="vocabBtn" onclick="prepareSentences()">توليد الجمل التعبيرية المشكولة</button>
    <div id="loading" style="display:none; color:#C5A059; margin-top:18px; font-weight:600;">جاري صياغة الجمل المتدرجة...</div>
    <div id="output" class="output"></div>
  </div>
</div>
<script>
  async function prepareSentences() {
    const btn = document.getElementById('vocabBtn'), loading = document.getElementById('loading'), output = document.getElementById('output');
    btn.disabled = true; loading.style.display = 'block'; output.style.display = 'none';
    try {
      const res = await fetch('http://127.0.0.1:8000/api/prepare-vocabulary', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vocab_list: document.getElementById('vocabList').value, target_level: document.getElementById('level').value })
      });
      const data = await res.json();
      loading.style.display = 'none'; btn.disabled = false;
      if(data.status === 'success') { output.textContent = data.vocab_output; output.style.display = 'block'; }
    } catch(err) { loading.style.display = 'none'; btn.disabled = false; alert('خطأ في الاتصال بالخادم.'); }
  }
</script>
</body>
</html>
